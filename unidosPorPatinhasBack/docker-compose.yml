version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: patinhas_db
    restart: always
    environment:
      POSTGRES_USER: patinhas
      POSTGRES_PASSWORD: patinhas123
      POSTGRES_DB: patinhas_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: